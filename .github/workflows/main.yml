name: Aggiornamento Dati Fanta

on:
  schedule:
    - cron: '0 4 * * *' # Ogni notte alle 04:00
  workflow_dispatch:   # Permette il lancio manuale

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui Scraper
        run: python scraper.py

      - name: Salva il JSON nel repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dati_fantacalcio.json
          git commit -m "Aggiornamento dati fanta: $(date)" || echo "Nessuna modifica rilevata"
          git push
