name: Aggiornamento Dati Fanta

on:
  schedule:
    - cron: '0 4 * * *' # Ogni notte alle 04:00
  workflow_dispatch:   # Permette il lancio manuale

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui Scraper
        run: python scraper.py

- name: Salva il JSON nel repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Se il file esiste, lo aggiunge. Se non esiste, non succede nulla.
          if [ -f dati_fantacalcio.json ]; then
            git add dati_fantacalcio.json
            # Commit solo se ci sono cambiamenti effettivi
            git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento dati: $(date)" && git push)
          else
            echo "File non trovato, salto il salvataggio."
          fi
