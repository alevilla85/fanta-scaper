name: Aggiornamento Dati Fanta

on:
  schedule:
    - cron: '0 4 * * *' # Ogni notte alle 04:00
  workflow_dispatch:   # Permette il lancio manuale

jobs:
  build:
    runs-on: ubuntu-latest
    # Aggiungiamo i permessi espliciti per scrivere nel repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui Scraper
        run: python scraper.py

      - name: Salva il JSON nel repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Controllo se il file è stato creato dallo script python
          if [ -f dati_fantacalcio.json ]; then
            git add dati_fantacalcio.json
            # Esegue il commit solo se il file è diverso dal precedente
            if ! git diff --cached --quiet; then
              git commit -m "Aggiornamento dati: $(date)"
              git push
            else
              echo "Nessuna variazione nei dati, salto il push."
            fi
          else
            echo "Errore: dati_fantacalcio.json non trovato!"
            exit 1
          fi
